{% extends "base.html" %}

{% block content %}
<div class="projects-page">
    <div class="section-heading fade-in">
        <h2>{{ item.title }}</h2>
        <div class="section-heading-bar"></div>
    </div>
    {% with page_mode = True %}
    {% include "components/_detail_panel.html" %}
    {% endwith %}
</div>

<div id="gallery-lightbox" class="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lightbox-prev" aria-label="Previous image">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="lightbox-next" aria-label="Next image">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <div class="lightbox-frame">
        <img class="lightbox-img" src="" alt="">
        <div class="lightbox-caption">
            <span class="lightbox-caption-label"></span>
            <span class="lightbox-caption-source"></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_url('js/projects.js', cache_bust=True) }}"></script>
{% endblock %}
