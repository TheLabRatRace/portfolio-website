{# One side quest row. Expects `quest`. #}
<a class="quest-row"
   href="{{ url_for('projects.detail', slug=quest.slug) }}"
   data-slug="{{ quest.slug }}">
    <div class="quest-row-left">
        <span class="status-dot {{ quest.status }}"></span>
        <h3 class="quest-row-title">{{ quest.title }}</h3>
        <span class="quest-status-label {{ quest.status }}">
            {{ '● live' if quest.status == 'active' else '● in progress' }}
        </span>
    </div>
    <div class="quest-row-right">
        <div class="quest-row-specs">
            {% for spec in (quest.specs or [])[:3] %}
            <span class="spec-tag">{{ spec }}</span>
            {% endfor %}
        </div>
        <svg class="ext-link-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
    </div>
</a>
